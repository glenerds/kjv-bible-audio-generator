[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kjv-audio-generator"
version = "0.4.12"
description = "Chapter-by-chapter KJV audiobook generator with persistent character voices"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "soundfile>=0.12"]

[project.optional-dependencies]
qwen = ["qwen-tts==0.1.1", "torch==2.10.0", "torchaudio==2.10.0", "transformers==4.57.3", "accelerate==1.12.0"]
dev = ["pytest>=8", "build>=1", "pyinstaller>=6", "torch==2.10.0"]

[project.scripts]
kjv-audio-generator = "kjv_audio_generator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.package-data]
kjv_audio_generator = ["data/*.json"]
