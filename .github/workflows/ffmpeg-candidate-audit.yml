name: Pinned Windows FFmpeg LGPL candidate audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ffmpeg-candidate-audit.yml"
      - "tools/run_ffmpeg_candidate_audit.ps1"
      - "tools/ensure_ffmpeg.ps1"
      - "tools/ffmpeg_notices.py"
      - "tools/import_ffmpeg_notices.ps1"
      - "LICENSES/README_FFMPEG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Windows / pinned FFmpeg LGPL candidate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python for notice import and WAV fixture
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64

      - name: Download and audit the pinned LGPL binary
        shell: pwsh
        run: ./tools/ensure_ffmpeg.ps1 -Root $env:GITHUB_WORKSPACE

      - name: Upload candidate audit evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-candidate-audit-2026-11-25
          path: artifacts/ffmpeg-candidate-audit/**
          if-no-files-found: error
          retention-days: 14
