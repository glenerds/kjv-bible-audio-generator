name: Cross-platform source tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up target Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install CPU PyTorch required by Qwen adapter tests
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source and tests
        run: python -m compileall -q src tests tools

      - name: Run full automated test suite on native Windows
        run: python -m pytest -q

      - name: Parse Windows PowerShell build scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'tools/build_windows.ps1',
            'tools/prepare_assets.ps1',
            'tools/import_ffmpeg_notices.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List *
              throw "PowerShell parse errors in $path"
            }
            Write-Host "PowerShell parse passed: $path"
          }

  linux-python:
    name: Ubuntu / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GUI display and CPU PyTorch required by Qwen adapter tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Compile source and tests
        run: python -m compileall -q src tests tools

      - name: Run full automated test suite
        run: xvfb-run -a python -m pytest -q
